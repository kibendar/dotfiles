# superfile theme, generated from the DMS wallpaper palette.
# Source template: ~/.config/matugen/templates/superfile.toml
# Rendered to:     ~/.config/superfile/theme/dms.toml on every DMS theme change.
# Edit the template, never the rendered file.

# Chroma has no Material palette, so this one value stays fixed.
# Alternatives: catppuccin-mocha, onedark, nord, dracula, gruvbox, monokai.
code_syntax_highlight = "catppuccin-mocha"

# ========= Border =========
file_panel_border = "#727072"
sidebar_border = "#403e41"
footer_border = "#727072"

# ========= Border Active =========
file_panel_border_active = "#ffd866"
sidebar_border_active = "#ffd866"
footer_border_active = "#ffd866"
modal_border_active = "#ffd866"

# ========= Background (bg) =========
full_screen_bg = "#2d2a2e"
file_panel_bg = "#2d2a2e"
sidebar_bg = "#2d2a2e"
footer_bg = "#2d2a2e"
modal_bg = "#2d2a2e"

# ========= Foreground (fg) =========
full_screen_fg = "#fcfcfa"
file_panel_fg = "#fcfcfa"
sidebar_fg = "#939293"
footer_fg = "#939293"
modal_fg = "#fcfcfa"

# ========= Special Color =========
cursor = "#ffd866"
correct = "#fc9867"
error = "#ff6188"
hint = "#fc9867"
cancel = "#727072"
# Gradient color can only have two color!
gradient_color = ["#ffd866", "#fc9867"]

# ========= File Panel Special Items =========
file_panel_top_directory_icon = "#ffd866"
file_panel_top_path = "#fc9867"
file_panel_item_selected_fg = "#fcfcfa"
file_panel_item_selected_bg = "#6e5a2f"

# ========= Sidebar Special Items =========
sidebar_title = "#ffd866"
sidebar_item_selected_fg = "#fcfcfa"
sidebar_item_selected_bg = "#403e41"
sidebar_divider = "#403e41"

# ========= Modal Special Items =========
modal_cancel_fg = "#939293"
modal_cancel_bg = "#403e41"

modal_confirm_fg = "#19181a"
modal_confirm_bg = "#ffd866"

# ========= Help Menu =========
help_menu_hotkey = "#ffd866"
help_menu_title = "#fc9867"
